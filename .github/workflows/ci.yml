name: CI

on:
  push:
    # This stacked draft PR targets Phase 1W rather than master. Keep an
    # explicit push-triggered CI run so the security branch remains tested.
    branches: [main, master, "feature/phase1y-synthetic-ticket-workflow"]
  pull_request:
    # PR #38 is intentionally stacked on Phase 1W. GitHub checks out the
    # generated merge commit for this event, so base drift is tested too.
    branches: [main, master, "feature/phase1w-preview-isolation-gate"]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  merge-result-context:
    name: PR Merge Result Context
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout GitHub-generated merge result
        uses: actions/checkout@v4
      - name: Fail closed unless the tested SHA is the PR merge result
        env:
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          EXPECTED_MERGE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
          ACTUAL_MERGE_REF: ${{ github.ref }}
        run: |
          test -n "$EXPECTED_MERGE_SHA"
          test "$ACTUAL_MERGE_REF" = "$EXPECTED_MERGE_REF"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = "3"

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: |
          python -m ruff check app tests scripts alembic

      - name: Mypy typecheck
        run: |
          python -m mypy app

      - name: Offline staging auth and runtime safety tests
        run: |
          python -m pytest -q \
            tests/test_staging_neon_jwt.py \
            tests/test_staging_neon_auth_integration.py \
            tests/test_phase1w_staging_runtime.py \
            tests/test_phase1w_staging_http_gate.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Generate Next.js route types
        working-directory: frontend
        run: npx next typegen

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend session tests
        working-directory: frontend
        run: npm run test:session

      - name: Frontend auth tests
        working-directory: frontend
        run: npm run test:auth

      - name: Preview isolation safety tests
        working-directory: frontend
        run: npm run test:staging

  # Separate, hermetic security qualification. A general 3k-test runner hang
  # must not mask the results of the Phase 1Y adversarial staging tests.
  # No Neon, Render, Vercel, Zendesk, Nhost or real provider credentials.
  phase1y-independent-security:
    name: Phase 1Y Isolated Security (Disposable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cxops
          POSTGRES_USER: cxops
          POSTGRES_PASSWORD: cxops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cxops -d cxops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://cxops:cxops@localhost:5432/cxops
      ENVIRONMENT: development
      DEBUG: "true"
      AUTH_DEV_MODE: "false"
      OPENAI_API_KEY: test-key
      ZENDESK_WEBHOOK_SECRET: test-secret
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked developer test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Migrate disposable Postgres only
        run: alembic upgrade head

      - name: Run staging JWT, RBAC, isolation, race and replay regressions
        run: |
          python -m pytest -q \
            tests/test_phase1y_synthetic_ticket_actions.py \
            tests/test_phase1y_independent_review.py \
            tests/test_staging_neon_jwt.py \
            tests/test_staging_neon_auth_integration.py \
            tests/test_phase1w_staging_http_gate.py \
            --tb=short -o faulthandler_timeout=120 --durations=20

  backend-tests:
    name: Backend Tests (Unit)
    runs-on: ubuntu-latest
    # Normal full suite completes in 7-9 minutes. A recent runner hung for 51
    # minutes without a completed test step: fail clearly instead of burning
    # unlimited CI minutes. Never skip or reduce the asserted test suite.
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cxops
          POSTGRES_USER: cxops
          POSTGRES_PASSWORD: cxops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cxops -d cxops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://cxops:cxops@localhost:5432/cxops
      ENVIRONMENT: development
      DEBUG: "true"
      OPENAI_API_KEY: test-key
      ZENDESK_WEBHOOK_SECRET: test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Phase 1Y synthetic workflow security tests
        run: python -m pytest -q tests/test_phase1y_synthetic_ticket_actions.py

      - name: Run pytest (unit)
        run: |
          pytest -q --tb=short -m "not integration" -o faulthandler_timeout=120 --durations=20

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VERCEL_ENV: preview
        run: npm run build

      - name: Preview isolation HTTP smoke (loopback only)
        working-directory: frontend
        env:
          VERCEL_ENV: preview
        run: node scripts/preview-isolation-smoke.mjs

  rag-evaluation:
    name: RAG Evaluation (Live - Optional)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://cxops:cxops@localhost:5432/cxops
      ENVIRONMENT: development
      DEBUG: "true"
      # Optional live evaluation. Runs only when BOTH dedicated evaluation
      # secrets exist; the production OPENAI_API_KEY is never available here.
      EVALUATION_ENABLED: ${{ github.event_name == 'push' && secrets.EVALUATION_OPENAI_API_KEY != '' && secrets.EVALUATION_ORGANIZATION_ID != '' }}
      ZENDESK_WEBHOOK_SECRET: test-secret
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cxops
          POSTGRES_USER: cxops
          POSTGRES_PASSWORD: cxops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cxops -d cxops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Seed knowledge base
        if: ${{ env.EVALUATION_ENABLED == 'true' }}
        run: python -m scripts.seed_knowledge_base --organization-id "$EVALUATION_ORGANIZATION_ID"
        env:
          OPENAI_API_KEY: ${{ secrets.EVALUATION_OPENAI_API_KEY }}
          EVALUATION_ORGANIZATION_ID: ${{ secrets.EVALUATION_ORGANIZATION_ID }}

      - name: Run RAG evaluation
        if: ${{ env.EVALUATION_ENABLED == 'true' }}
        run: python -m scripts.evaluate_rag --organization-id "$EVALUATION_ORGANIZATION_ID"
        env:
          OPENAI_API_KEY: ${{ secrets.EVALUATION_OPENAI_API_KEY }}
          EVALUATION_ORGANIZATION_ID: ${{ secrets.EVALUATION_ORGANIZATION_ID }}

      - name: RAG evaluation skipped
        if: ${{ env.EVALUATION_ENABLED == 'false' }}
        run: |
          echo "Live RAG evaluation skipped: EVALUATION_OPENAI_API_KEY and EVALUATION_ORGANIZATION_ID are not both configured."

  agent-evaluation:
    name: Agent Evaluation (Live - Optional)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://cxops:cxops@localhost:5432/cxops
      ENVIRONMENT: development
      DEBUG: "true"
      # Optional live evaluation. Runs only when BOTH dedicated evaluation
      # secrets exist; the production OPENAI_API_KEY is never available here.
      EVALUATION_ENABLED: ${{ github.event_name == 'push' && secrets.EVALUATION_OPENAI_API_KEY != '' && secrets.EVALUATION_ORGANIZATION_ID != '' }}
      ZENDESK_WEBHOOK_SECRET: test-secret
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cxops
          POSTGRES_USER: cxops
          POSTGRES_PASSWORD: cxops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cxops -d cxops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Seed knowledge base
        if: ${{ env.EVALUATION_ENABLED == 'true' }}
        run: python -m scripts.seed_knowledge_base --organization-id "$EVALUATION_ORGANIZATION_ID"
        env:
          OPENAI_API_KEY: ${{ secrets.EVALUATION_OPENAI_API_KEY }}
          EVALUATION_ORGANIZATION_ID: ${{ secrets.EVALUATION_ORGANIZATION_ID }}

      - name: Run agent evaluation
        if: ${{ env.EVALUATION_ENABLED == 'true' }}
        run: python -m scripts.evaluate_agent --organization-id "$EVALUATION_ORGANIZATION_ID"
        env:
          OPENAI_API_KEY: ${{ secrets.EVALUATION_OPENAI_API_KEY }}
          EVALUATION_ORGANIZATION_ID: ${{ secrets.EVALUATION_ORGANIZATION_ID }}

      - name: Agent evaluation skipped
        if: ${{ env.EVALUATION_ENABLED == 'false' }}
        run: |
          echo "Live Agent evaluation skipped: EVALUATION_OPENAI_API_KEY and EVALUATION_ORGANIZATION_ID are not both configured."

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cxops-api:test .

      - name: Verify staging JWT module is packaged (network disabled)
        run: |
          docker run --rm --network none --entrypoint python cxops-api:test -c \
            "from staging.neon_jwt import STAGING_AUTH_ORIGIN, verify_signed_staging_jwt; from app.core.auth import get_current_principal; assert STAGING_AUTH_ORIGIN.startswith('https://')"


      - name: Build frontend image
        run: docker build -t cxops-frontend:test ./frontend

  api-contract:
    name: API Contract (Schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    # Independent, disposable DB: deliberately distinct from backend-tests.
    # This job cannot connect to Neon or any external provider. Fail closed
    # before application import / migration if the connection target drifts.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cxops_contract_disposable_test
          POSTGRES_USER: cxops_contract
          POSTGRES_PASSWORD: cxops_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cxops_contract -d cxops_contract_disposable_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CXOPS_API_CONTRACT_RUN: "1"
      DATABASE_URL: postgresql+asyncpg://cxops_contract:cxops_contract@127.0.0.1:5432/cxops_contract_disposable_test
      ENVIRONMENT: development
      DEBUG: "false"
      AUTH_MODE: hs256
      AUTH_DEV_MODE: "false"
      OPENAI_API_KEY: ""
      EVALUATION_OPENAI_API_KEY: ""
      PUBLIC_LEAD_CAPTURE_ENABLED: "false"
      PUBLIC_CHAT_ASYNC_ENABLED: "false"
      HANDOFF_NOTIFICATIONS_ENABLED: "false"
      ONBOARDING_KNOWLEDGE_SETUP_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install production lock plus CI-only contract tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-contract.txt
          python -m pip check

      - name: Refuse any non-disposable test target
        run: python -m scripts.api_contract_guard

      - name: Migrate only the disposable PostgreSQL database
        run: alembic upgrade head

      - name: Fuzz nine anonymous endpoints with local in-process ASGI
        run: python -m pytest -q --tb=short tests/contract/test_public_schemathesis.py

      - name: Test three authenticated staff GET APIs and tenant RBAC (disposable only)
        run: python -m pytest -q --tb=short tests/contract/test_staff_schemathesis.py

      - name: Verify JWT, visitor bearer and staff capability OpenAPI documentation
        run: python -m pytest -q --tb=short tests/test_phase1uf_openapi_security.py

  required-checks:
    name: CI Required Checks
    if: always()
    needs:
      - merge-result-context
      - lint-and-typecheck
      - phase1y-independent-security
      - backend-tests
      - frontend-build
      - secret-scan
      - docker-build
      - api-contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail closed on any incomplete mandatory check
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_RESULT: ${{ needs.merge-result-context.result }}
          LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
          PHASE1Y_RESULT: ${{ needs.phase1y-independent-security.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          CONTRACT_RESULT: ${{ needs.api-contract.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$PHASE1Y_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$SECRET_RESULT" = success
          test "$DOCKER_RESULT" = success
          test "$CONTRACT_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$MERGE_RESULT" = success
          else
            test "$MERGE_RESULT" = skipped
          fi
