# Source-only C10 reviewer assignment and audit tests.
# Applies migration ONLY to exact disposable 127.0.0.1 Postgres.
name: Chatbot C10 — Private Reviewer Audit (Disposable)

on:
  pull_request:
    branches:
      - codex/chatbot-c9-browser-auth-regression
    paths:
      - '.github/workflows/chatbot-c10-private-audit-offline.yml'
      - 'alembic/versions/1r0a0001_claim_review_private_audit.py'
      - 'app/models/claim_review.py'
      - 'app/models/__init__.py'
      - 'app/services/private_claim_review_service.py'
      - 'tests/test_chatbot_c10_private_audit.py'
      - 'docs/product/chatbot-c10-private-review-audit.md'

permissions:
  contents: read

concurrency:
  group: cxops-c10-private-review-audit
  cancel-in-progress: true

jobs:
  disposable-audit:
    name: Real PostgreSQL Tenant+Audit Constraints / No Providers
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
    env:
      CI: 'true'
      CXOPS_CHATBOT_C2_OFFLINE: 'true'
      ENVIRONMENT: development
      DEBUG: 'false'
      AUTH_MODE: hs256
      AUTH_DEV_MODE: 'false'
      DATABASE_URL: 'postgresql+asyncpg://c2_probe:c2_probe@127.0.0.1:5432/cxops_chatbot_c2_disposable_test'
      OPENAI_API_KEY: ''
      EVALUATION_OPENAI_API_KEY: ''
      ZENDESK_WEBHOOK_SECRET: ''
      ZENDESK_CLIENT_SECRET: ''
      ZENDESK_CLIENT_ID: ''
      HANDOFF_NOTIFICATION_EMAIL_URL: ''
      HANDOFF_NOTIFICATION_TELEGRAM_URL: ''
      HANDOFF_NOTIFICATIONS_ENABLED: 'false'
      PUBLIC_LEAD_CAPTURE_ENABLED: 'false'
      PUBLIC_CHAT_ASYNC_ENABLED: 'false'
      CXOPS_STAGING_TICKET_ACTIONS_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cxops_chatbot_c2_disposable_test
          POSTGRES_USER: c2_probe
          POSTGRES_PASSWORD: c2_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U c2_probe -d cxops_chatbot_c2_disposable_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout PR merge result; credentials disabled
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse all remote database/provider/paid targets before imports
        run: |
          python scripts/chatbot_c2_disposable_guard.py
          test -z "$OPENAI_API_KEY"
          test -z "$EVALUATION_OPENAI_API_KEY"
          test -z "$ZENDESK_WEBHOOK_SECRET"
          test -z "$ZENDESK_CLIENT_SECRET"
          test -z "$ZENDESK_CLIENT_ID"
          test -z "$HANDOFF_NOTIFICATION_EMAIL_URL"
          test -z "$HANDOFF_NOTIFICATION_TELEGRAM_URL"
          test "$PUBLIC_LEAD_CAPTURE_ENABLED" = false
          test "$CXOPS_STAGING_TICKET_ACTIONS_ENABLED" = false

      - name: Install existing locked application + pinned Ruff
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check ruff==0.16.10

      - name: Check single migration head and upgrade only local C10 DB
        run: |
          python scripts/chatbot_c2_disposable_guard.py
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          alembic current

      - name: Exercise real tenant composites, reviewer separation and SQL triggers
        run: |
          python scripts/chatbot_c2_disposable_guard.py
          python -m pytest -q --tb=short \
            tests/test_chatbot_c10_private_audit.py \
            tests/test_chatbot_claim_review.py \
            tests/test_chatbot_c2_guard.py \
            -o faulthandler_timeout=120

      - name: Pinned Ruff schema/service/fixture consistency
        run: |
          python -m ruff check \
            alembic/versions/1r0a0001_claim_review_private_audit.py \
            app/models/claim_review.py \
            app/models/__init__.py \
            app/services/private_claim_review_service.py \
            tests/test_chatbot_c10_private_audit.py

      - name: Prove only disposable schema can downgrade and re-upgrade
        run: |
          python scripts/chatbot_c2_disposable_guard.py
          alembic downgrade 1q0a0001
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from scripts.chatbot_c2_disposable_guard import DISPOSABLE_URL
          async def check():
              engine = create_async_engine(DISPOSABLE_URL)
              try:
                  async with engine.connect() as conn:
                      version = (
                          await conn.execute(text("SELECT version_num FROM alembic_version"))
                      ).scalar_one()
                      assert version == "1q0a0001", version
                      for name in ("claim_review_batches", "claim_review_items",
                                   "claim_review_assignments", "claim_review_events"):
                          result = (
                              await conn.execute(
                                  text("SELECT to_regclass(:name)"),
                                  {"name": name},
                              )
                          ).scalar_one()
                          assert result is None, name
              finally:
                  await engine.dispose()
          asyncio.run(check())
          PY
          alembic upgrade head
          alembic current
