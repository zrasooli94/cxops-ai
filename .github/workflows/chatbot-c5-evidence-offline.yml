# C3 customer chatbot: bounded same-tenant follow-up context; source-only.
# No Render cutover, production DB, OpenAI key or provider operations.
name: Chatbot C5 — Offline Citation Consistency

on:
  pull_request:
    branches:
      - codex/chatbot-c4-mobile-accessibility
    paths:
      - '.github/workflows/chatbot-c5-evidence-offline.yml'
      - 'app/services/chat_followup_context.py'
      - 'app/services/public_answer_evidence.py'
      - 'app/services/rag_reliability.py'
      - 'app/core/metrics.py'
      - 'app/services/public_chat_service.py'
      - 'app/services/rag_service.py'
      - 'tests/test_chatbot_c3_followup.py'
      - 'tests/test_chatbot_c5_evidence.py'
      - 'tests/test_chatbot_c2_offline.py'
      - 'tests/test_public_chat.py'
      - 'tests/test_public_chat_async.py'
      - 'docs/product/chatbot-c5-cited-evidence.md'

permissions:
  contents: read

concurrency:
  group: cxops-chatbot-c5-evidence-offline
  cancel-in-progress: true

jobs:
  c5-synthetic-citation:
    name: RAG Citation + Real Chat / Disposable PG / No Providers
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    env:
      CI: 'true'
      CXOPS_CHATBOT_C2_OFFLINE: 'true'
      DATABASE_URL: 'postgresql+asyncpg://c2_probe:c2_probe@127.0.0.1:5432/cxops_chatbot_c2_disposable_test'
      ENVIRONMENT: development
      DEBUG: 'false'
      AUTH_MODE: hs256
      AUTH_DEV_MODE: 'false'
      OPENAI_API_KEY: ''
      EVALUATION_OPENAI_API_KEY: ''
      ZENDESK_WEBHOOK_SECRET: ''
      ZENDESK_CLIENT_SECRET: ''
      ZENDESK_CLIENT_ID: ''
      HANDOFF_NOTIFICATION_EMAIL_URL: ''
      HANDOFF_NOTIFICATION_TELEGRAM_URL: ''
      HANDOFF_NOTIFICATIONS_ENABLED: 'false'
      PUBLIC_LEAD_CAPTURE_ENABLED: 'false'
      PUBLIC_CHAT_ASYNC_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cxops_chatbot_c2_disposable_test
          POSTGRES_USER: c2_probe
          POSTGRES_PASSWORD: c2_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U c2_probe -d cxops_chatbot_c2_disposable_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout GitHub-generated PR merge, credentials disabled
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse production target before import/install/migrations
        run: python scripts/chatbot_c2_disposable_guard.py

      - name: Install exact app lock with no provider key
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check ruff==0.16.10

      - name: Apply only disposable PostgreSQL migrations
        run: |
          python scripts/chatbot_c2_disposable_guard.py
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head

      - name: Evidence consistency and previous C2/C3 offline tests
        run: |
          python scripts/chatbot_c2_disposable_guard.py
          python -m pytest -q --tb=short \
            tests/test_chatbot_c5_evidence.py \
            tests/test_chatbot_c3_followup.py \
            tests/test_chatbot_c2_offline.py \
            tests/test_chatbot_c2_guard.py \
            tests/test_rag_reliability.py \
            tests/test_rag_citation_repair.py

      - name: Real public chat sync and async regression against local PG
        run: |
          python scripts/chatbot_c2_disposable_guard.py
          python -m pytest -q --tb=short \
            tests/test_public_chat.py \
            tests/test_public_chat_async.py \
            -o faulthandler_timeout=120 --durations=10

      - name: Pinned Ruff evidence and chatbot changes
        run: |
          python -m ruff check \
            app/services/public_answer_evidence.py \
            app/services/rag_reliability.py \
            app/core/metrics.py \
            app/services/chat_followup_context.py \
            app/services/public_chat_service.py \
            app/services/rag_service.py \
            tests/test_chatbot_c5_evidence.py \
            tests/test_chatbot_c3_followup.py \
            tests/test_public_chat.py \
            tests/test_public_chat_async.py
