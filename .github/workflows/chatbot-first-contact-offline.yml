# Customer chatbot UX checks only. This workflow has no access to
# production worker credentials, databases, LLMs, or live integrations.
name: Chatbot First Contact (Offline Source-Only)

on:
  pull_request:
    branches:
      - codex/chatbot-ui-source-base
    paths:
      - '.github/workflows/chatbot-first-contact-offline.yml'
      - 'frontend/src/app/chat/embed/embed.tsx'
      - 'frontend/src/lib/public-chat/starter-prompts.ts'
      - 'frontend/src/lib/public-chat/starter-prompts.test.ts'
      - 'docs/product/chatbot-development-track.md'

permissions:
  contents: read

concurrency:
  group: cxops-chatbot-first-contact
  cancel-in-progress: true

jobs:
  frontend-chatbot-offline:
    name: Widget Tests, Lint, Types & Build — No Providers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      ENVIRONMENT: development
      OPENAI_API_KEY: ''
      EVALUATION_OPENAI_API_KEY: ''
      ZENDESK_WEBHOOK_SECRET: ''
      DATABASE_URL: ''
      HANDOFF_NOTIFICATIONS_ENABLED: 'false'
      CXOPS_STAGING_TICKET_ACTIONS_ENABLED: 'false'

    steps:
      - name: Checkout PR merge result with credentials disabled
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refuse any provider credentials or production target
        run: |
          test "$ENVIRONMENT" = development
          test -z "$OPENAI_API_KEY"
          test -z "$EVALUATION_OPENAI_API_KEY"
          test -z "$ZENDESK_WEBHOOK_SECRET"
          test -z "$DATABASE_URL"
          test "$HANDOFF_NOTIFICATIONS_ENABLED" = false
          test "$CXOPS_STAGING_TICKET_ACTIONS_ENABLED" = false

      - name: Install lockfile dependencies, no app backend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend unit and contract tests
        working-directory: frontend
        run: npm test

      - name: ESLint changed chatbot files
        working-directory: frontend
        run: |
          npx eslint \
            src/app/chat/embed/embed.tsx \
            src/lib/public-chat/starter-prompts.ts \
            src/lib/public-chat/starter-prompts.test.ts

      - name: Generate Next.js route types
        working-directory: frontend
        run: npx next typegen

      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend in disposable GitHub runner only
        working-directory: frontend
        run: npm run build
