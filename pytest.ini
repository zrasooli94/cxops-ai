# Session-scoped asyncio loops are REQUIRED for the async SQLAlchemy/asyncpg
# test architecture: the app engine's connection pool is process-global, and
# asyncpg connections are bound to the event loop that created them. With a
# per-test (function-scoped) loop, a pooled connection created in test #1 is
# reused unbound in test #2 -> "Task got Future attached to a different loop".
# A single session loop makes pooling deterministic and is not hiding a test
# isolation defect: every test still gets fresh fixtures/state, only the loop
# is shared.
[pytest]
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session