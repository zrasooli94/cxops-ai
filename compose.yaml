services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cxops-postgres

    environment:
      POSTGRES_DB: cxops
      POSTGRES_USER: cxops
      POSTGRES_PASSWORD: cxops

    ports:
      - "5432:5432"

    volumes:
      - cxops_postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cxops -d cxops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cxops_postgres_data: